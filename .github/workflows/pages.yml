name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extrair o site
        run: |
          mkdir -p _site
          unzip -q site.zip -d _site
          rm -f _site/netlify.toml
          echo "www.mentorixs.com.br" > _site/CNAME
          touch _site/.nojekyll
          echo ".wa-float{width:60px!important;padding:0!important}.wa-float-text{display:none!important}.wa-float .wa-icon{width:32px;height:32px}" >> _site/assets/css/site.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # o GitHub às vezes demora para registrar o pacote: espera e tenta de novo se a 1ª publicação falhar
      - run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
